plugins {
    id 'java'
    id 'com.github.spotbugs'
    id 'checkstyle'
}

description = 'Ballerina - CDC Native'

dependencies {
    checkstyle project(":checkstyle")
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstylePluginVersion}"

    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"
    implementation group: 'io.ballerina.lib', name: 'data.jsondata-native', version: "${stdlibDataJsonDataVersion}"

    implementation group: 'com.google.code.gson', name: 'gson', version: "${gsonVersion}"

    implementation("io.debezium:debezium-api:${debeziumVersion}") {
        transitive = false
    }

    // debezium-api references io.debezium.DebeziumException (declared in debezium-core), but
    // debezium-core is deliberately excluded from the runtime classpath above (transitive = false,
    // to keep the native jar lean). SpotBugs 6.5.1's stricter class-hierarchy resolution needs that
    // class on its analysis classpath or it fails hard (exit code 3, "classes needed for analysis
    // were missing"); compileOnly satisfies SpotBugs without affecting the shipped jar.
    // debezium-api references io.debezium.DebeziumException (declared in debezium-util), which
    // isn't pulled in because debezium-api is deliberately non-transitive above (keeps the native
    // jar lean). SpotBugs 6.5.1's stricter class-hierarchy resolution needs that class on its
    // analysis classpath or it fails hard (exit code 3, "classes needed for analysis were missing").
    compileOnly("io.debezium:debezium-util:${debeziumVersion}") {
        transitive = false
    }
}

def excludePattern = '**/module-info.java'
tasks.withType(Checkstyle).configureEach {
    exclude excludePattern
}

checkstyle {
    toolVersion "${project.checkstylePluginVersion}"
    configFile rootProject.file("build-config/checkstyle/build/checkstyle.xml")
    configProperties = ["suppressionFile": file("${rootDir}/build-config/checkstyle/build/suppressions.xml")]
}

checkstyleMain.dependsOn(":checkstyle:downloadCheckstyleRuleFiles")

spotbugsMain {
    def classLoader = plugins["com.github.spotbugs"].class.classLoader
    def SpotBugsConfidence = classLoader.findLoadedClass("com.github.spotbugs.snom.Confidence")
    def SpotBugsEffort = classLoader.findLoadedClass("com.github.spotbugs.snom.Effort")
    effort = SpotBugsEffort.MAX
    reportLevel = SpotBugsConfidence.LOW
    reportsDir = layout.buildDirectory.dir("reports/spotbugs")
    reports {
        html.enabled true
        text.enabled = true
    }
    def excludeFile = file("${rootDir}/build-config/spotbugs-exclude.xml")
    if (excludeFile.exists()) {
        excludeFilter = excludeFile
    }
}

spotbugsTest {
    enabled = false
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}
